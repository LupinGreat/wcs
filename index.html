<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Classroom</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--brand:#4f46e5;--brand2:#eef2ff;--ok:#16a34a;--bad:#dc2626;--line:#e5e7eb}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
  header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--brand);color:#fff}
  main{max-width:720px;margin:0 auto;padding:16px 16px 100px}
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;border:0;background:none;padding:12px 4px;font-size:13px;color:var(--muted);cursor:pointer}
  nav button.on{color:var(--brand);font-weight:700;background:var(--brand2)}
  h2{margin:8px 0 12px} h3{margin:0 0 6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card.done{opacity:.6}
  .txt{white-space:pre-wrap;word-break:break-word}
  .muted{color:var(--muted)} .err{color:var(--bad)}
  .chip{display:inline-block;background:var(--brand2);color:var(--brand);border-radius:999px;padding:2px 10px;font-size:13px;margin:0 6px 6px 0}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:2px;font-weight:700}
  input,textarea,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;margin:4px 0 10px;background:#fff}
  textarea{min-height:90px}
  button,.btn{display:inline-block;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer;text-decoration:none;margin:4px 6px 4px 0}
  button.ghost{background:transparent;color:inherit;border:1px solid currentColor;padding:6px 12px}
  button.grey{background:#e5e7eb;color:var(--ink)} button.red{background:var(--bad)}
  label{font-size:14px;color:var(--muted)}
  .login{max-width:380px;margin:12vh auto 0;padding:20px;text-align:center}
  .login h1{margin:0 0 4px} .login input{text-align:center;font-size:22px;letter-spacing:3px;text-transform:uppercase}
  .login details input{font-size:16px;letter-spacing:0;text-transform:none}
  .login button{width:100%}
  details{margin-top:24px;text-align:left} summary{cursor:pointer;color:var(--muted);text-align:center}
  .checks label{display:flex;gap:8px;align-items:center;color:var(--ink);margin:2px 0}
  .checks input{width:auto;margin:0}
  .card.off{opacity:.55}
  label.upl{display:inline-block;background:#e5e7eb;color:var(--ink);border-radius:10px;padding:10px 16px;cursor:pointer;margin:4px 6px 4px 0;font-size:16px}
  .thumbwrap{display:inline-block;width:46%;max-width:200px;margin:4px 8px 8px 0;font-size:12px;color:var(--muted);text-decoration:none;vertical-align:top}
  .thumb{width:100%;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;background:#eee}
  .thumbwrap span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frow{display:flex;align-items:center;gap:6px;margin:2px 0}
  .frow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frow button{margin:0;padding:6px 10px}
  details.box{margin-top:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 14px 6px;margin-bottom:10px}
  details.box>summary{cursor:pointer;font-weight:700;padding:12px 0;color:var(--ink);text-align:left}
  details.box[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
  .lrow{display:flex;gap:6px;align-items:center}
  .lrow input{width:auto;min-width:0;margin:4px 0}
  .lrow input:nth-child(1){flex:1} .lrow input:nth-child(2){flex:2} .lrow button{margin:0}
  button.ok{background:var(--ok)}
  #toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90%}
  #toast.show{opacity:1}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, collection, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref as sref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import { firebaseConfig } from "./firebase-config.js";   /* your Firebase values live in firebase-config.js */

const root = document.getElementById('root');
const S = { user: null, role: null, profile: null, tab: null, planDate: null, loginMsg: '', pendingWork: [], pendingPrint: [] };

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
const linkify = t => esc(t).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const secs = x => x?.createdAt?.seconds || 0;
let toastTimer;
function toast(m, ms = 2600){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms); }
function friendly(e){
  const c = e?.code || '';
  if (c.startsWith('storage/')) return c === 'storage/unauthorized' ? 'Upload not allowed. Check the Storage rules (see UPLOADS-SETUP.md).' : 'Upload problem (' + c.slice(8) + ').';
  if (c.includes('permission')) return 'Not allowed.';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found') || c.includes('invalid-email')) return "That didn't work. Check it and try again.";
  if (c.includes('email-already-in-use')) return 'That code already exists. Try again.';
  if (c.includes('network')) return 'No internet connection.';
  return e?.message || 'Something went wrong.';
}

/* codes: 6 digits (older 8-letter codes still work) */
function newCode(){ return String(crypto.getRandomValues(new Uint32Array(1))[0] % 1000000).padStart(6, '0'); }
const fmtCode = c => c.length === 6 ? c.slice(0,3) + ' ' + c.slice(3) : c.slice(0,4) + '-' + c.slice(4);
const fmtDay = d => new Date(d + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const normCode = s => s.toUpperCase().replace(/[^A-Z0-9]/g, '');
const codeEmail = c => c.toLowerCase() + '@portal.local';

/* ---------- firebase ---------- */
if (firebaseConfig.apiKey.startsWith('PASTE')) {
  root.innerHTML = '<div class="login"><h1>Almost there</h1><p>Open <b>firebase-config.js</b> and paste your Firebase values (see UPLOADS-SETUP.md).</p></div>';
  throw new Error('Firebase config not filled in');
}
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const BUCKET = firebaseConfig.storageBucket && !firebaseConfig.storageBucket.startsWith('PASTE') ? firebaseConfig.storageBucket : firebaseConfig.projectId + '.firebasestorage.app';
const storage = getStorage(app, 'gs://' + BUCKET);
let secApp = null;
async function makeAccount(code){
  /* second app instance so creating a kid's account does not log the teacher out */
  secApp = secApp || initializeApp(firebaseConfig, 'secondary');
  const sa = getAuth(secApp);
  const cred = await createUserWithEmailAndPassword(sa, codeEmail(code), code);
  const uid = cred.user.uid;
  await signOut(sa);
  return uid;
}
/* make an account for a code; with no code given, picks a random free 6-digit one */
async function freshAccount(wanted){
  for (let n = 0; n < 12; n++) {
    const code = wanted || newCode();
    try { return { code, uid: await makeAccount(code) }; }
    catch(e) { if (e.code === 'auth/email-already-in-use' && !wanted) continue; throw e; }
  }
  throw new Error('Could not make a free code. Try again.');
}
/* all = true also returns turned-off people (one entry per person) */
async function getUsers(role, all = false){
  const s = await getDocs(query(collection(db, 'users'), where('role', '==', role)));
  const byName = (a, b) => a.name.localeCompare(b.name);
  const list = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(u => !u.replaced);
  if (!all) return list.filter(u => u.active).sort(byName);
  const by = {};
  list.forEach(u => { const c = by[u.sid]; if (!c || (u.active && !c.active) || (!!u.active === !!c.active && secs(u) > secs(c))) by[u.sid] = u; });
  return Object.values(by).sort(byName);
}

/* ---------- file uploads (Firebase Storage) ---------- */
const ACCEPT = '.pdf,image/*,.doc,.docx,.ppt,.pptx,.xls,.xlsx';
const safeName = n => n.replace(/[^\w.\- ]+/g, '_').replace(/\s+/g, '_').slice(-80);
const isImg = f => (f.type || '').startsWith('image/') || /\.(png|jpe?g|gif|webp)$/i.test(f.name || '');
const fileIcon = f => { const s = (f.type || '') + (f.name || ''); return /pdf/i.test(s) ? '📕' : /word|\.docx?$/i.test(s) ? '📘' : '📄'; };
async function uploadFiles(fileList, folder, maxMb = 20){
  const files = [...fileList], out = [];
  for (let n = 0; n < files.length; n++) {
    const f = files[n];
    if (f.size > maxMb * 1048576) { toast(f.name + ' is bigger than ' + maxMb + ' MB'); continue; }
    toast('Uploading ' + (n + 1) + ' of ' + files.length + '…', 60000);
    const path = folder + '/' + Date.now() + '-' + n + '-' + safeName(f.name);
    const r = sref(storage, path);
    await uploadBytes(r, f, { contentType: f.type || 'application/octet-stream' });
    out.push({ name: f.name, type: f.type || '', path, url: await getDownloadURL(r) });
  }
  if (out.length) toast(out.length + ' uploaded');
  return out;
}
const delFiles = paths => Promise.all((paths || []).filter(Boolean).map(p => deleteObject(sref(storage, p)).catch(() => {})));
/* images show as small pictures (tap to open full size); other files are buttons. All open in a new tab */
function filesHtml(files){
  return (files || []).filter(f => safeUrl(f.url)).map(f => isImg(f)
    ? `<a class="thumbwrap" href="${esc(f.url)}" target="_blank" rel="noopener"><img class="thumb" loading="lazy" src="${esc(f.url)}" alt=""><span>${esc(f.name)}</span></a>`
    : `<a class="btn" href="${esc(f.url)}" target="_blank" rel="noopener">${fileIcon(f)} ${esc(f.name)}</a>`).join('');
}
function renderPending(kind){
  const el = document.getElementById('pend-' + kind); if (!el) return;
  const list = kind === 'work' ? S.pendingWork : S.pendingPrint;
  el.innerHTML = list.map((f, i) => `<div class="frow"><span>${fileIcon(f)} ${esc(f.name)}</span><button type="button" class="red" data-a="pendrm" data-kind="${kind}" data-i="${i}">✕</button></div>`).join('');
}
async function handleUpload(inp){
  const files = inp.files; if (!files || !files.length) return;
  const d = inp.dataset;
  try {
    if (d.kind === 'box') {
      const it = ED[d.k][+d.i];
      const up = await uploadFiles(files, d.k === 'info' ? 'info' : 'plan/' + S.planDate);
      it.files.push(...up); it.open = true; redraw(d.k);
    } else if (d.kind === 'work') {
      S.pendingWork.push(...await uploadFiles(files, 'work')); renderPending('work');
    } else if (d.kind === 'print') {
      S.pendingPrint.push(...await uploadFiles(files, 'prints/' + S.user.uid, 10)); renderPending('print');
    }
  } catch(err) { toast(friendly(err)); }
  inp.value = '';
}

/* ---------- login ---------- */
function renderLogin(){
  root.innerHTML = `<div class="login">
    <h1>📚 Our Classroom</h1>
    <p class="muted">Type your code to get in</p>
    <form data-form="code">
      <input id="code" placeholder="123456" autocomplete="off" inputmode="numeric" required>
      <button>Go</button>
    </form>
    <p class="err">${esc(S.loginMsg)}</p>
    <details><summary>Teacher login</summary>
      <form data-form="teacher">
        <input id="em" type="email" placeholder="Email" autocomplete="username" required>
        <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
        <button>Log in</button>
      </form>
    </details></div>`;
}
const FORMS = {
  async code(f){
    const c = normCode(f.querySelector('#code').value);
    S.loginMsg = '';
    try { await signInWithEmailAndPassword(auth, codeEmail(c), c); }
    catch(e){ S.loginMsg = friendly(e); renderLogin(); }
  },
  async teacher(f){
    S.loginMsg = '';
    try { await signInWithEmailAndPassword(auth, f.querySelector('#em').value.trim(), f.querySelector('#pw').value); }
    catch(e){ S.loginMsg = friendly(e); renderLogin(); }
  },
  async addstudents(f){
    const names = f.querySelector('#names').value.split('\n').map(x => x.trim()).filter(Boolean);
    for (const name of names){
      const { code, uid } = await freshAccount();
      await setDoc(doc(db, 'users', uid), { role: 'student', name, code, sid: uid, active: true, createdAt: serverTimestamp() });
    }
    toast(names.length + ' added'); show();
  },
  async addsub(f){
    const name = f.querySelector('#subname').value.trim(); if (!name) return;
    const wanted = f.querySelector('#subcode').value.trim();
    if (wanted && !/^\d{6}$/.test(wanted)) return toast('Code must be exactly 6 digits');
    const { code, uid } = await freshAccount(wanted || null);
    await setDoc(doc(db, 'users', uid), { role: 'sub', name, code, sid: uid, active: true, createdAt: serverTimestamp() });
    toast('Sub code created'); show();
  },
  async newwork(f){
    const all = f.querySelector('#toall').checked;
    const picked = [...f.querySelectorAll('.pick:checked')].map(x => x.value);
    if (!all && !picked.length) return toast('Choose who it is for');
    await addDoc(collection(db, 'assignments'), {
      title: f.querySelector('#wtitle').value.trim(), text: f.querySelector('#wtext').value.trim(),
      link: f.querySelector('#wlink').value.trim(), due: f.querySelector('#wdue').value, files: S.pendingWork,
      audience: all ? ['all'] : picked, createdAt: serverTimestamp()
    });
    toast('Posted'); show();
  },
  async print(f){
    const url = f.querySelector('#purl').value.trim();
    if (url && !safeUrl(url)) return toast('A link must start with http');
    if (!url && !S.pendingPrint.length) return toast('Paste a link or upload a file');
    await addDoc(collection(db, 'requests'), { sid: S.profile.sid, studentName: S.profile.name, url, files: S.pendingPrint, note: f.querySelector('#pnote').value.trim(), status: 'pending', createdAt: serverTimestamp() });
    toast('Sent to your teacher'); show();
  },
  async board(f){ await setDoc(doc(db, 'board', 'main'), { text: f.querySelector('#btext').value, updatedAt: serverTimestamp() }); toast('Saved'); },
};

/* ---------- collapsible boxes (class info + day plan) ---------- */
const ED = { info: [], plan: [], planSubs: [], trash: { info: [], plan: [] } };
const blankBox = (title = '') => ({ title, text: '', links: [], files: [], open: false });
function normItems(d, legacyTitle){
  if (d && Array.isArray(d.items)) return d.items.map(i => ({ title: i.title || '', text: i.text || '', links: Array.isArray(i.links) ? i.links.map(l => ({ label: l.label || '', url: l.url || '' })) : [], files: Array.isArray(i.files) ? i.files.map(f => ({ name: f.name || '', type: f.type || '', path: f.path || '', url: f.url || '' })) : [], open: false }));
  if (d && d.text) return [{ title: legacyTitle, text: d.text, links: [], files: [], open: false }];  /* old single-textarea data */
  return [];
}
function editorHtml(k){
  const ph = k === 'plan' ? 'e.g. Period 1: Math' : 'e.g. Routines';
  const items = ED[k];
  return items.map((b, i) => `<details class="box" data-k="${k}" data-i="${i}" ${b.open ? 'open' : ''}>
      <summary>${esc(b.title || '(untitled)')}</summary>
      <label>Title</label><input data-ed="${k}" data-i="${i}" data-f="title" value="${esc(b.title)}" placeholder="${ph}">
      <label>Instructions</label><textarea data-ed="${k}" data-i="${i}" data-f="text" style="min-height:130px">${esc(b.text)}</textarea>
      <label>Links to photos / PDFs to print</label>
      ${b.links.map((l, j) => `<div class="lrow"><input data-ed="${k}" data-i="${i}" data-j="${j}" data-f="label" placeholder="Name" value="${esc(l.label)}"><input data-ed="${k}" data-i="${i}" data-j="${j}" data-f="url" type="url" placeholder="https://…" value="${esc(l.url)}"><button class="red" data-a="edlinkdel" data-k="${k}" data-i="${i}" data-j="${j}">✕</button></div>`).join('')}
      <button class="grey" data-a="edlinkadd" data-k="${k}" data-i="${i}">＋ Add link</button><br>
      <label>Uploaded files (PDF, photo, Word…)</label>
      ${b.files.map((f, j) => `<div class="frow"><span>${fileIcon(f)} ${esc(f.name)}</span><button class="red" data-a="edfiledel" data-k="${k}" data-i="${i}" data-j="${j}">✕</button></div>`).join('')}
      <label class="upl">📎 Upload file<input type="file" class="fileup" multiple hidden accept="${ACCEPT}" data-kind="box" data-k="${k}" data-i="${i}"></label><br>
      <button class="grey" data-a="edup" data-k="${k}" data-i="${i}">↑</button><button class="grey" data-a="eddown" data-k="${k}" data-i="${i}">↓</button><button class="red" data-a="eddel" data-k="${k}" data-i="${i}">Delete box</button>
    </details>`).join('')
    + `<button data-a="edadd" data-k="${k}">＋ Add box</button><button class="ok" data-a="edsave" data-k="${k}">Save</button>`;
}
const redraw = k => { const el = document.getElementById('ed-' + k); if (el) el.innerHTML = editorHtml(k); };
function boxesView(items, emptyMsg){
  const list = items.filter(b => b.title || b.text || b.links.length || b.files.length);
  if (!list.length) return `<div class="card muted">${emptyMsg}</div>`;
  return list.map(b => `<details class="box"><summary>${esc(b.title || 'Untitled')}</summary>
    <div class="txt">${linkify(b.text)}</div>
    ${filesHtml(b.files)}
    ${b.links.filter(l => safeUrl(l.url)).map(l => `<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">🖨️ ${esc(l.label || 'Open to print')}</a>`).join('')}</details>`).join('');
}

/* ---------- actions (buttons) ---------- */
async function changeCode(id){
  const old = (await getDoc(doc(db, 'users', id))).data();
  const v = prompt('New 6-digit code for ' + old.name + '\n(leave empty for a random one)', '');
  if (v === null) return;
  const wanted = v.trim();
  if (wanted && !/^\d{6}$/.test(wanted)) return toast('Code must be exactly 6 digits');
  let made;
  try { made = await freshAccount(wanted || null); }
  catch(e) { if (e.code === 'auth/email-already-in-use') return toast('That code is already used (maybe by a turned-off person). Try another.'); throw e; }
  /* same person (same sid), new login; the old login is retired */
  await setDoc(doc(db, 'users', made.uid), { role: old.role, name: old.name, code: made.code, sid: old.sid, active: !!old.active, createdAt: serverTimestamp() });
  await updateDoc(doc(db, 'users', id), { active: false, replaced: true });
  toast('Code changed'); show();
}
const personCard = u => `<div class="card ${u.active ? '' : 'off'}"><h3>${esc(u.name)} ${u.active ? '' : '<span class="chip">Off</span>'}</h3><div class="code">${fmtCode(u.code)}</div>
  <button class="grey" data-a="rename" data-id="${u.id}">Rename</button><button class="grey" data-a="setcode" data-id="${u.id}">Change code</button>
  ${u.active ? `<button class="red" data-a="setactive" data-id="${u.id}" data-v="0">Turn off</button>`
    : `<button class="ok" data-a="setactive" data-id="${u.id}" data-v="1">Turn on</button><button class="red" data-a="deluser" data-id="${u.id}">Delete</button>`}</div>`;
const ACTIONS = {
  tab: b => { S.tab = b.dataset.k; show(); },
  logout: () => signOut(auth),
  done: async b => { const sid = S.profile.sid; await setDoc(doc(db, 'done', sid + '_' + b.dataset.id), { sid, aid: b.dataset.id, at: serverTimestamp() }); show(); },
  undo: async b => { await deleteDoc(doc(db, 'done', S.profile.sid + '_' + b.dataset.id)); show(); },
  setcode: b => changeCode(b.dataset.id),
  rename: async b => {
    const ref = doc(db, 'users', b.dataset.id);
    const old = (await getDoc(ref)).data();
    const n = prompt('Name', old.name); if (n === null || !n.trim()) return;
    await updateDoc(ref, { name: n.trim() }); toast('Renamed'); show();
  },
  setactive: async b => { await updateDoc(doc(db, 'users', b.dataset.id), { active: b.dataset.v === '1' }); show(); },
  deluser: async b => { if (!confirm('Delete this person for good? Their code stops working and cannot be turned back on.')) return; await deleteDoc(doc(db, 'users', b.dataset.id)); show(); },
  delwork: async b => {
    if (!confirm('Delete this post?')) return;
    const ref = doc(db, 'assignments', b.dataset.id);
    await delFiles(((await getDoc(ref)).data()?.files || []).map(f => f.path));
    await deleteDoc(ref); show();
  },
  printed: async b => { await updateDoc(doc(db, 'requests', b.dataset.id), { status: 'printed' }); show(); },
  delreq: async b => {
    const ref = doc(db, 'requests', b.dataset.id);
    await delFiles(((await getDoc(ref)).data()?.files || []).map(f => f.path));
    await deleteDoc(ref); show();
  },
  loadplan: b => { S.planDate = b.dataset.d; show(); },
  edadd: b => { const k = b.dataset.k; ED[k].push({ ...blankBox(), open: true }); redraw(k); },
  eddel: b => { const { k, i } = b.dataset; if (!confirm('Delete this box?')) return; const [gone] = ED[k].splice(+i, 1); ED.trash[k].push(...gone.files.map(f => f.path)); redraw(k); },
  edfiledel: b => { const { k, i, j } = b.dataset; const [f] = ED[k][+i].files.splice(+j, 1); if (f) ED.trash[k].push(f.path); redraw(k); },
  pendrm: async b => {
    const list = b.dataset.kind === 'work' ? S.pendingWork : S.pendingPrint;
    const [f] = list.splice(+b.dataset.i, 1); renderPending(b.dataset.kind);
    if (f) await delFiles([f.path]);
  },
  edup: b => { const { k } = b.dataset, i = +b.dataset.i; if (i < 1) return; [ED[k][i - 1], ED[k][i]] = [ED[k][i], ED[k][i - 1]]; redraw(k); },
  eddown: b => { const { k } = b.dataset, i = +b.dataset.i; if (i >= ED[k].length - 1) return; [ED[k][i + 1], ED[k][i]] = [ED[k][i], ED[k][i + 1]]; redraw(k); },
  edlinkadd: b => { const it = ED[b.dataset.k][+b.dataset.i]; it.links.push({ label: '', url: '' }); it.open = true; redraw(b.dataset.k); },
  edlinkdel: b => { ED[b.dataset.k][+b.dataset.i].links.splice(+b.dataset.j, 1); redraw(b.dataset.k); },
  edsave: async b => {
    const k = b.dataset.k;
    const items = ED[k].map(x => ({ title: x.title.trim(), text: x.text.trim(), links: x.links.map(l => ({ label: l.label.trim(), url: l.url.trim() })).filter(l => l.url), files: x.files.map(f => ({ name: f.name, type: f.type, path: f.path, url: f.url })) }))
      .filter(x => x.title || x.text || x.links.length || x.files.length);
    if (items.some(x => x.links.some(l => !safeUrl(l.url)))) return toast('Links must start with http:// or https://');
    const data = k === 'info' ? { items, updatedAt: serverTimestamp() } : { items, subs: ED.planSubs, updatedAt: serverTimestamp() };
    await setDoc(doc(db, k === 'info' ? 'subinfo' : 'subplans', k === 'info' ? 'general' : S.planDate), data);
    await delFiles(ED.trash[k]); ED.trash[k] = [];
    toast('Saved');
    if (k === 'plan') show();
  },
  cards: async () => {
    const list = [...await getUsers('student')];
    const w = window.open('', '_blank'); if (!w) return toast('Allow pop-ups to print');
    w.document.write('<html><head><title>Code cards</title><style>body{font-family:sans-serif}.c{display:inline-block;width:45%;border:2px dashed #999;padding:16px;margin:6px;text-align:center}.k{font:bold 28px monospace;letter-spacing:3px}</style></head><body>' +
      list.map(u => '<div class="c"><div>' + esc(u.name) + '</div><div class="k">' + fmtCode(u.code) + '</div><div>Type this code on the class website</div></div>').join('') + '</body></html>');
    w.document.close(); setTimeout(() => w.print(), 400);
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  Promise.resolve(ACTIONS[b.dataset.a]?.(b)).catch(err => toast(friendly(err)));
});
document.addEventListener('submit', e => {
  const f = e.target; if (!f.dataset.form) return;
  e.preventDefault();
  Promise.resolve(FORMS[f.dataset.form]?.(f)).catch(err => toast(friendly(err)));
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset.ed) return;
  const b = ED[t.dataset.ed]?.[+t.dataset.i]; if (!b) return;
  if (t.dataset.j !== undefined) { const l = b.links[+t.dataset.j]; if (l) l[t.dataset.f] = t.value; }
  else { b[t.dataset.f] = t.value; if (t.dataset.f === 'title') t.closest('details').querySelector('summary').textContent = t.value || '(untitled)'; }
});
document.addEventListener('toggle', e => {
  const d = e.target; if (!d.dataset || !d.dataset.k) return;
  const b = ED[d.dataset.k]?.[+d.dataset.i]; if (b) b.open = d.open;
}, true);
document.addEventListener('change', e => {
  if (e.target.id === 'plandate' && e.target.value) { S.planDate = e.target.value; show(); }
  if (e.target.classList.contains('fileup')) { handleUpload(e.target); }
  if (e.target.classList.contains('subpick')) { ED.planSubs = [...document.querySelectorAll('.subpick:checked')].map(x => x.value); }
  if (e.target.id === 'toall') { document.querySelectorAll('.pick').forEach(x => { x.disabled = e.target.checked; if (e.target.checked) x.checked = false; }); }
});

/* ---------- shell ---------- */
const TABS = {
  student: [['home', '🏠 Home'], ['work', '📝 My work'], ['print', '🖨️ Print']],
  teacher: [['students', '👩‍🎓 Students'], ['work', '📝 Work'], ['print', '🖨️ Print'], ['board', '📌 Board'], ['sub', '🧑‍🏫 Sub']],
  sub: [['day', '📅 Day plan'], ['info', 'ℹ️ Class info']]
};
function shell(content){
  root.innerHTML = `<header><b>${esc(S.profile.name)}</b><button class="ghost" data-a="logout">Log out</button></header>
    <main>${content}</main>
    <nav>${TABS[S.role].map(([k, l]) => `<button data-a="tab" data-k="${k}" class="${S.tab === k ? 'on' : ''}">${l}</button>`).join('')}</nav>`;
}
async function show(){
  shell('<p class="muted">Loading…</p>');
  try { shell(await VIEWS[S.role + ':' + S.tab]()); }
  catch(e){ console.error(e); shell('<p class="err">' + esc(friendly(e)) + '</p>'); }
}

/* ---------- student views ---------- */
async function myWork(){
  const sid = S.profile.sid, A = collection(db, 'assignments');
  const [a1, a2, d] = await Promise.all([
    getDocs(query(A, where('audience', 'array-contains', 'all'))),
    getDocs(query(A, where('audience', 'array-contains', sid))),
    getDocs(query(collection(db, 'done'), where('sid', '==', sid)))
  ]);
  const doneSet = new Set(d.docs.map(x => x.data().aid));
  const m = new Map();
  [...a1.docs, ...a2.docs].forEach(x => m.set(x.id, { id: x.id, ...x.data() }));
  return [...m.values()].map(a => ({ ...a, done: doneSet.has(a.id) })).sort((x, y) => secs(y) - secs(x));
}
const workCard = (a, mine) => `<div class="card ${a.done ? 'done' : ''}">
  <h3>${esc(a.title)}</h3>${a.due ? `<span class="chip">Due ${esc(a.due)}</span>` : ''}
  <div class="txt">${linkify(a.text)}</div>
  ${safeUrl(a.link) ? `<a class="btn" href="${esc(a.link)}" target="_blank" rel="noopener">Open work</a>` : ''}
  ${filesHtml(a.files)}
  ${mine ? `<button class="${a.done ? 'grey' : ''}" data-a="${a.done ? 'undo' : 'done'}" data-id="${a.id}">${a.done ? 'Undo' : '✓ Mark done'}</button>` : ''}</div>`;

const VIEWS = {
  'student:home': async () => {
    const b = await getDoc(doc(db, 'board', 'main'));
    const text = b.exists() ? b.data().text : '';
    const w = await myWork(); const pending = w.filter(a => !a.done).length;
    return `<h2>Hi ${esc(S.profile.name)} 👋</h2>
      <div class="card"><h3>📌 Classroom board</h3><div class="txt">${text ? linkify(text) : '<span class="muted">Nothing posted yet.</span>'}</div></div>
      <div class="card"><h3>📝 My work</h3><p>${pending ? `You have <b>${pending}</b> thing${pending > 1 ? 's' : ''} to do.` : 'You are all caught up! 🎉'}</p></div>`;
  },
  'student:work': async () => {
    const w = await myWork(); const todo = w.filter(a => !a.done), dn = w.filter(a => a.done);
    return `<h2>To do</h2>${todo.map(a => workCard(a, true)).join('') || '<p class="muted">Nothing to do right now 🎉</p>'}
      ${dn.length ? `<h2>Done</h2>${dn.map(a => workCard(a, true)).join('')}` : ''}`;
  },
  'student:print': async () => {
    S.pendingPrint = [];
    const s = await getDocs(query(collection(db, 'requests'), where('sid', '==', S.profile.sid)));
    const list = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => secs(b) - secs(a));
    return `<h2>Ask for a print</h2><div class="card"><form data-form="print">
      <label>Paste a link to the picture</label><input id="purl" type="url" placeholder="https://…">
      <label>…or upload a photo or PDF</label><div id="pend-print"></div>
      <label class="upl">📎 Upload file<input type="file" class="fileup" hidden accept=".pdf,image/*" data-kind="print"></label><br>
      <label>Note for your teacher (optional)</label><textarea id="pnote" placeholder="e.g. size, colour or black &amp; white"></textarea>
      <button>Send</button></form></div>
      <h2>My requests</h2>${list.map(r => `<div class="card">${safeUrl(r.url) ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a><br>` : ''}${filesHtml(r.files)}<div class="txt">${esc(r.note)}</div>
      <span class="chip">${r.status === 'printed' ? '✅ Printed' : '⏳ Waiting'}</span></div>`).join('') || '<p class="muted">No requests yet.</p>'}`;
  },

  /* ---------- teacher ---------- */
  'teacher:students': async () => {
    const list = await getUsers('student', true);
    return `<h2>Students (${list.filter(u => u.active).length})</h2>
      <div class="card"><form data-form="addstudents"><label>Add students: one name per line</label>
        <textarea id="names" placeholder="Aman&#10;Sara&#10;Leo" required></textarea><button>Add &amp; make codes</button></form></div>
      ${list.length ? '<button class="grey" data-a="cards">🖨️ Print code cards</button>' : ''}
      ${list.map(personCard).join('')}`;
  },
  'teacher:work': async () => {
    S.pendingWork = [];
    const [students, as, dn] = await Promise.all([getUsers('student'), getDocs(collection(db, 'assignments')), getDocs(collection(db, 'done'))]);
    const doneBy = {}; dn.docs.forEach(d => { const x = d.data(); (doneBy[x.aid] = doneBy[x.aid] || new Set()).add(x.sid); });
    const sidName = Object.fromEntries(students.map(s => [s.sid, s.name]));
    const list = as.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => secs(b) - secs(a));
    return `<h2>Give work</h2><div class="card"><form data-form="newwork">
      <label>Title</label><input id="wtitle" required>
      <label>Instructions (optional)</label><textarea id="wtext"></textarea>
      <label>Link to photo / PDF / Google Doc (optional)</label><input id="wlink" type="url" placeholder="https://…">
      <label>Upload files: PDF, photo, Word… (optional)</label><div id="pend-work"></div>
      <label class="upl">📎 Upload file<input type="file" class="fileup" multiple hidden accept="${ACCEPT}" data-kind="work"></label><br>
      <label>Due date (optional)</label><input id="wdue" type="date">
      <label>For</label><div class="checks"><label><input type="checkbox" id="toall" checked> Whole class</label>
        ${students.map(s => `<label><input type="checkbox" class="pick" value="${s.sid}" disabled> ${esc(s.name)}</label>`).join('')}</div>
      <button>Post</button></form></div>
      <h2>Posted</h2>${list.map(a => {
        const total = a.audience.includes('all') ? students.length : a.audience.length;
        const n = [...(doneBy[a.id] || [])].filter(s => sidName[s]).length;
        const who = a.audience.includes('all') ? 'Whole class' : a.audience.map(s => sidName[s] || '?').join(', ');
        return `<div class="card"><h3>${esc(a.title)}</h3><span class="chip">${esc(who)}</span><span class="chip">Done ${n}/${total}</span>${a.due ? `<span class="chip">Due ${esc(a.due)}</span>` : ''}
          <div class="txt">${linkify(a.text)}</div>${safeUrl(a.link) ? `<a href="${esc(a.link)}" target="_blank" rel="noopener">Open link</a><br>` : ''}${filesHtml(a.files)}<br>
          <button class="red" data-a="delwork" data-id="${a.id}">Delete</button></div>`; }).join('') || '<p class="muted">Nothing posted yet.</p>'}`;
  },
  'teacher:print': async () => {
    const s = await getDocs(collection(db, 'requests'));
    const list = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.status === 'printed') - (b.status === 'printed') || secs(b) - secs(a));
    return `<h2>Print requests</h2>${list.map(r => `<div class="card"><h3>${esc(r.studentName)}</h3>
      ${safeUrl(r.url) ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">Open picture link</a><br>` : ''}${filesHtml(r.files)}<div class="txt">${esc(r.note)}</div>
      <span class="chip">${r.status === 'printed' ? '✅ Printed' : '⏳ Waiting'}</span><br>
      ${r.status === 'printed' ? '' : `<button data-a="printed" data-id="${r.id}">Mark printed</button>`}<button class="red" data-a="delreq" data-id="${r.id}">Delete</button></div>`).join('') || '<p class="muted">No requests.</p>'}`;
  },
  'teacher:board': async () => {
    const b = await getDoc(doc(db, 'board', 'main'));
    return `<h2>Classroom board</h2><div class="card"><p class="muted">Everyone sees this on their Home page.</p><form data-form="board">
      <textarea id="btext" style="min-height:220px" placeholder="Today we are…&#10;Reminders…">${esc(b.exists() ? b.data().text : '')}</textarea><button>Save</button></form></div>`;
  },
  'teacher:sub': async () => {
    S.planDate = S.planDate || todayStr();
    const [subs, info, plan, all] = await Promise.all([getUsers('sub', true), getDoc(doc(db, 'subinfo', 'general')), getDoc(doc(db, 'subplans', S.planDate)), getDocs(collection(db, 'subplans'))]);
    const subName = Object.fromEntries(subs.map(s => [s.sid, s.name]));
    const dates = all.docs.map(d => ({ id: d.id, names: (d.data().subs || []).map(x => subName[x] || '?').join(', ') })).sort((a, b) => b.id.localeCompare(a.id));
    ED.trash = { info: [], plan: [] };
    ED.planSubs = plan.exists() ? (plan.data().subs || []) : [];
    ED.info = normItems(info.exists() ? info.data() : null, 'General info');
    if (!ED.info.length) ED.info = [blankBox('Routines'), blankBox('Student information')];
    ED.plan = normItems(plan.exists() ? plan.data() : null, 'Day plan');
    return `<h2>Sub codes</h2><div class="card"><form data-form="addsub"><label>Name or label (e.g. "Mrs. Lee" or "Monday sub")</label>
        <input id="subname" required>
        <label>6-digit code (leave empty for a random one)</label><input id="subcode" inputmode="numeric" maxlength="6" placeholder="optional">
        <button>Make a sub code</button></form></div>
      ${subs.map(personCard).join('')}
      <h2>General class info</h2><p class="muted">Boxes the sub can open: routines, student information, anything else. Use "Add box" for more.</p>
      <div id="ed-info">${editorHtml('info')}</div>
      <h2>Plan for a day</h2><input type="date" id="plandate" value="${S.planDate}">
      <div class="card checks"><b>Who is covering ${esc(fmtDay(S.planDate))}?</b>
        <p class="muted">Only the subs you tick can see this day's plan. Tap Save below to keep it.</p>
        ${subs.map(s => `<label><input type="checkbox" class="subpick" value="${s.sid}" ${ED.planSubs.includes(s.sid) ? 'checked' : ''}> ${esc(s.name)}${s.active ? '' : ' (off)'}</label>`).join('') || '<p class="muted">Make a sub code first.</p>'}</div>
      <p class="muted">One box per period. Add a title, instructions, and links to photos or PDFs the sub can print.</p>
      <div id="ed-plan">${editorHtml('plan')}</div>
      ${dates.length ? '<p class="muted">Days with a plan:</p>' + dates.map(d => `<button class="grey" data-a="loadplan" data-d="${d.id}">${esc(fmtDay(d.id))} · ${esc(d.names || 'no sub yet')}</button>`).join('') : ''}`;
  },

  /* ---------- sub ---------- */
  'sub:day': async () => {
    /* a sub only receives the days the teacher assigned to them */
    const s = await getDocs(query(collection(db, 'subplans'), where('subs', 'array-contains', S.profile.sid)));
    const plans = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.id.localeCompare(b.id));
    if (!plans.length) return '<h2>Day plan</h2><div class="card muted">No days have been assigned to you yet. Check Class info, or ask the teacher.</div>';
    const t = todayStr();
    if (!plans.some(p => p.id === S.planDate)) S.planDate = (plans.find(p => p.id >= t) || plans[plans.length - 1]).id;
    const p = plans.find(x => x.id === S.planDate);
    return `<h2>Day plan</h2>
      ${plans.map(x => `<button class="${x.id === S.planDate ? '' : 'grey'}" data-a="loadplan" data-d="${x.id}">${esc(fmtDay(x.id))}${x.id === t ? ' (today)' : ''}</button>`).join('')}
      <h3 style="margin-top:12px">${esc(fmtDay(p.id))}</h3>
      ${boxesView(normItems(p, 'Day plan'), 'No details for this day yet. Check Class info.')}`;
  },
  'sub:info': async () => {
    const i = await getDoc(doc(db, 'subinfo', 'general'));
    return `<h2>Class info</h2>${boxesView(normItems(i.exists() ? i.data() : null, 'General info'), 'Nothing here yet.')}`;
  }
};

/* ---------- session ---------- */
onAuthStateChanged(auth, async user => {
  if (!user) { S.user = null; renderLogin(); return; }
  S.user = user;
  let snap = null;
  try { snap = await getDoc(doc(db, 'users', user.uid)); } catch(e) { /* no profile */ }
  if (snap && snap.exists()) {
    const p = snap.data();
    if (!p.active) { S.loginMsg = 'This code has been turned off. Ask your teacher.'; await signOut(auth); return; }
    S.profile = p; S.role = p.role;
  } else {
    /* no profile = maybe the teacher; only the teacher is allowed to read the student list */
    try { await getDocs(query(collection(db, 'users'), where('role', '==', 'student'))); S.role = 'teacher'; S.profile = { name: 'Teacher' }; }
    catch(e) { S.loginMsg = 'This login has no access.'; await signOut(auth); return; }
  }
  S.tab = TABS[S.role][0][0];
  show();
});
</script>
